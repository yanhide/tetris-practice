<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シンプル テトリス</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrapper">
    <section class="game-panel" aria-labelledby="game-title">
      <h1 id="game-title">シンプル テトリス</h1>
      <p class="lead">キーボードでブロックを動かして、横一列をそろえて消しましょう。</p>

      <div class="play-area">
        <div class="board-area">
          <!-- メインのゲーム画面です。JavaScript がここにブロックを描きます。 -->
          <canvas id="game" width="300" height="600" aria-label="テトリスのゲーム画面"></canvas>
          <div id="effect-banner" class="effect-banner" aria-live="polite"></div>
        </div>

        <aside class="next-panel" aria-labelledby="next-title">
          <h2 id="next-title">次のブロック</h2>
          <!-- 次に来るブロックだけを小さく描くための画面です。 -->
          <canvas id="next" width="120" height="120" aria-label="次に来るブロック"></canvas>
        </aside>
      </div>

      <div class="status-row">
        <p>スコア: <span id="score">0</span></p>
        <p id="message" class="message">Enter でスタート</p>
      </div>

      <div class="button-row">
        <button id="start-button" type="button">ゲーム開始 / リスタート</button>
        <button id="pause-button" type="button" disabled>一時停止</button>
      </div>
    </section>

    <aside class="how-to-play" aria-labelledby="how-to-title">
      <h2 id="how-to-title">操作方法</h2>
      <ul>
        <li><kbd>←</kbd> / <kbd>→</kbd>: 左右に移動</li>
        <li><kbd>↑</kbd> / <kbd>Space</kbd>: 回転</li>
        <li><kbd>↓</kbd>: 1マス下に移動</li>
        <li><kbd>Enter</kbd>: ゲーム開始 / 一時停止 / 再開</li>
      </ul>
      <p>ブロックが上まで積み上がるとゲームオーバーです。4ライン同時に消すと「TETRIS!」と表示されます。</p>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
